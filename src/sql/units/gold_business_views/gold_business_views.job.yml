resources:
  jobs:
    gold_business_views:
      name: ${var.job_name_prefix}gold_business_views
      max_concurrent_runs: 1
      parameters:
        - name: drop
          default: D0
        - name: manifest_drops
          default: '{"D0": {"batch_id": 20250630, "business_date": "2025-06-30", "counts": {"nvb_edw.dim_account": 8000, "nvb_edw.dim_branch": 8, "nvb_edw.dim_calendar": 547, "nvb_edw.dim_card": 6000, "nvb_edw.dim_merchant": 80, "nvb_edw.dim_product": 4, "nvb_edw.fct_daily_balance": 4376000, "nvb_edw.fct_loan": 1800, "nvb_edw.fct_product_order": 3500, "nvb_stg.customer_feed": 5100, "nvb_stg.transaction_feed": 180000}}}'
        - name: as_of_date
          default: '2025-06-30'
        - name: window_start
          default: '2024-01-01'
        - name: report_year
          default: '2025'
      tags:
        environment: ${bundle.target}
        migration_unit: gold_business_views
      tasks:
        - task_key: v_customer_portfolio
          max_retries: 0
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../../orchestration/create_view.sql
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              drop: '{{job.parameters.drop}}'
              manifest_drops: '{{job.parameters.manifest_drops}}'
              view_sql: |
                CREATE OR REPLACE VIEW {gold}.v_customer_portfolio AS
                SELECT c.customer_id, c.customer_name, c.town, b.branch_name, b.region_cd, s.segment,
                       count(a.account_id) AS account_count,
                       sum(CASE WHEN a.dormant_flag = 'Y' THEN 1 ELSE 0 END) AS dormant_account_count,
                       count(DISTINCT a.product_id) AS product_count,
                       coalesce(max(s.spend), 0) AS trailing_year_debit_spend,
                       max(c.load_ts) AS customer_delivery_ts
                FROM {silver}.dim_customer AS c
                JOIN {silver}.dim_branch AS b ON c.branch_id = b.branch_id
                LEFT JOIN {silver}.dim_account AS a ON c.customer_id = a.customer_id AND a.record_status_cd = 'A'
                LEFT JOIN {gold}.mart_customer_segment AS s ON c.customer_id = s.customer_id
                WHERE c.record_status_cd = 'A'
                GROUP BY c.customer_id, c.customer_name, c.town, b.branch_name, b.region_cd, s.segment
        - task_key: v_credit_risk
          max_retries: 0
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../../orchestration/create_view.sql
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              drop: '{{job.parameters.drop}}'
              manifest_drops: '{{job.parameters.manifest_drops}}'
              view_sql: |
                CREATE OR REPLACE VIEW {gold}.v_credit_risk AS
                SELECT a.customer_id, c.customer_name, b.town AS branch_town,
                       count(l.loan_id) AS loan_count, sum(l.outstanding) AS exposure,
                       max(l.arrears_days) AS worst_arrears_days,
                       sum(CASE WHEN l.arrears_days >= 90 THEN l.outstanding ELSE 0 END)
                         / nullif(sum(l.outstanding), 0) AS impaired_ratio,
                       sum(CASE WHEN l.arrears_days BETWEEN 30 AND 89 THEN l.outstanding ELSE 0 END) AS watchlist_exposure,
                       CASE WHEN max(l.arrears_days) >= 90 THEN 'IMPAIRED'
                            WHEN max(l.arrears_days) >= 30 THEN 'WATCH' ELSE 'PERFORMING' END AS risk_band
                FROM {silver}.fct_loan AS l
                JOIN {silver}.dim_account AS a ON l.account_id = a.account_id
                JOIN {silver}.dim_customer AS c ON a.customer_id = c.customer_id
                JOIN {silver}.dim_branch AS b ON c.branch_id = b.branch_id
                WHERE l.record_status_cd = 'A'
                GROUP BY a.customer_id, c.customer_name, b.town
        - task_key: v_channel_trend
          max_retries: 0
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../../orchestration/create_view.sql
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              drop: '{{job.parameters.drop}}'
              manifest_drops: '{{job.parameters.manifest_drops}}'
              view_sql: |
                CREATE OR REPLACE VIEW {gold}.v_channel_trend AS
                SELECT d.calendar_date AS txn_date, d.year_no, d.month_no, d.month_start,
                       'MOBILE' AS channel, coalesce(m.txn_count, 0) AS txn_count,
                       coalesce(m.net_amount, 0) AS net_amount,
                       sum(coalesce(m.net_amount, 0)) OVER (
                         ORDER BY d.calendar_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_amount,
                       avg(coalesce(m.net_amount, 0)) OVER (
                         ORDER BY d.calendar_date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) AS seven_day_average,
                       coalesce(m.net_amount, 0) / nullif(m.txn_count, 0) AS average_payment,
                       CASE WHEN m.txn_count IS NULL THEN 'NO_ACTIVITY' ELSE 'CLEARED' END AS activity_status
                FROM {silver}.dim_calendar AS d
                LEFT JOIN {gold}.mart_channel_daily AS m ON d.calendar_date = m.txn_date AND m.channel = 'MOBILE'
                WHERE d.calendar_date BETWEEN (SELECT min(calendar_date) FROM {silver}.dim_calendar)
                                          AND DATE '{business_date}'
        - task_key: report_finance_monthly
          max_retries: 0
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../../orchestration/create_view.sql
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              drop: '{{job.parameters.drop}}'
              manifest_drops: '{{job.parameters.manifest_drops}}'
              view_sql: |
                CREATE OR REPLACE VIEW {gold}.report_finance_monthly AS
                SELECT month_start, sum(closing_balance) AS closing_balance, sum(average_balance) AS average_balance
                FROM {gold}.mart_monthly_balance
                WHERE year(month_start) = year(DATE '{business_date}')
                GROUP BY month_start ORDER BY month_start
        - task_key: report_branch_league
          max_retries: 0
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../../orchestration/create_view.sql
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              drop: '{{job.parameters.drop}}'
              manifest_drops: '{{job.parameters.manifest_drops}}'
              view_sql: |
                CREATE OR REPLACE VIEW {gold}.report_branch_league AS
                SELECT b.town, p.customer_count, p.net_amount, p.league_rank
                FROM {gold}.mart_branch_performance AS p
                JOIN {silver}.dim_branch AS b ON p.branch_id = b.branch_id
                ORDER BY p.league_rank
        - task_key: report_card_services
          max_retries: 0
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../../orchestration/create_view.sql
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              drop: '{{job.parameters.drop}}'
              manifest_drops: '{{job.parameters.manifest_drops}}'
              view_sql: |
                CREATE OR REPLACE VIEW {gold}.report_card_services AS
                SELECT category, txn_count, spend, spend / nullif(sum(spend) OVER (), 0) AS share_of_spend
                FROM {gold}.mart_card_spend_category ORDER BY spend DESC
        - task_key: report_risk_arrears
          max_retries: 0
          depends_on:
            - task_key: v_credit_risk
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../../orchestration/create_view.sql
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              drop: '{{job.parameters.drop}}'
              manifest_drops: '{{job.parameters.manifest_drops}}'
              view_sql: |
                CREATE OR REPLACE VIEW {gold}.report_risk_arrears AS
                SELECT customer_id, exposure, impaired_ratio FROM {gold}.v_credit_risk
                WHERE impaired_ratio > 0 ORDER BY exposure DESC
        - task_key: reconcile_business_views
          max_retries: 0
          depends_on:
            - task_key: v_customer_portfolio
            - task_key: v_credit_risk
            - task_key: v_channel_trend
            - task_key: report_finance_monthly
            - task_key: report_branch_league
            - task_key: report_card_services
            - task_key: report_risk_arrears
          notebook_task:
            notebook_path: ./reconcile_task.py
            base_parameters:
              bundle_root: ${workspace.file_path}
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              drop: '{{job.parameters.drop}}'
              manifest_drops: '{{job.parameters.manifest_drops}}'
              as_of_date: '{{job.parameters.as_of_date}}'
              window_start: '{{job.parameters.window_start}}'
              report_year: '{{job.parameters.report_year}}'
