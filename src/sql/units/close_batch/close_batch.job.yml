resources:
  jobs:
    close_batch:
      name: ${var.job_name_prefix}close_batch
      max_concurrent_runs: 1
      parameters:
        - name: drop
          default: D0
        - name: window_start
          default: '2024-01-01'
      tags:
        environment: ${bundle.target}
      tasks:
        - task_key: close_batch
          max_retries: 0
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./close_batch.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              drop: "{{job.parameters.drop}}"
              window_start: "{{job.parameters.window_start}}"
        - task_key: verify_close_batch
          max_retries: 0
          depends_on:
            - task_key: close_batch
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./check_close_batch.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              drop: "{{job.parameters.drop}}"
