resources:
  jobs:
    gold_product_profitability:
      name: ${var.job_name_prefix}gold_product_profitability
      max_concurrent_runs: 1
      parameters:
        - name: drop
          default: D0
        - name: as_of_date
          default: "2025-06-30"
        - name: window_start
          default: "2024-01-01"
        - name: load_ts
          default: "2025-06-30 23:00:00"
      tags:
        environment: ${bundle.target}
        migration_unit: gold_product_profitability
      environments:
        - environment_key: parity
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk>=0.85,<1
      tasks:
        - task_key: build_mart_product_profitability
          max_retries: 0
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./product_profitability.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              as_of_date: "{{job.parameters.as_of_date}}"
              window_start: "{{job.parameters.window_start}}"
              load_ts: "{{job.parameters.load_ts}}"
        - task_key: verify_gold_product_profitability
          max_retries: 0
          depends_on:
            - task_key: build_mart_product_profitability
          environment_key: parity
          spark_python_task:
            python_file: ../../../parity/parity_check.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --suffix
              - ${var.schema_suffix}
              - --drop
              - "{{job.parameters.drop}}"
              - --layer
              - gold
              - --selected-units
              - gold_product_profitability
              - --warehouse-id
              - ${var.warehouse_id}
              - --output
              - /tmp/gold-product-profitability-parity.json
