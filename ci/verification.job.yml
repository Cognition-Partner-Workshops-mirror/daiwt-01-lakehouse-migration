resources:
  jobs:
    verification:
      name: ${var.job_name_prefix}verification
      parameters:
        - name: drop
          default: D0
        - name: units
          default: '*'
      environments:
        - environment_key: parity
          spec:
            environment_version: '2'
            dependencies:
              - databricks-sdk>=0.85,<1
              - PyYAML>=6,<7
      tasks:
        - task_key: verify
          environment_key: parity
          spark_python_task:
            python_file: ../src/parity/parity_check.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --suffix
              - ${var.schema_suffix}
              - --warehouse-id
              - ${var.warehouse_id}
              - --drop
              - '{{job.parameters.drop}}'
              - --selected-units
              - '{{job.parameters.units}}'
              - --output
              - /tmp/daiwt-01-parity.json
